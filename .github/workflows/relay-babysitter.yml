name: relay-babysitter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-babysitter
  cancel-in-progress: false

jobs:
  babysit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe relays + escrow runway
        id: probe
        run: |
          set +e
          python scripts/relay_babysitter.py | tee babysitter.txt
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Open/refresh alert issue on failure
        if: steps.probe.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Babysitter alert: relay health or escrow runway degraded"
          BODY="$(printf 'Automated relay-babysitter alert (%s):\n\n```\n%s\n```\n' "$(date -u +%FT%TZ)" "$(cat babysitter.txt)")"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      - name: Fail the run if degraded (visible red X)
        if: steps.probe.outputs.rc != '0'
        run: exit 1
